skill_id: read_missing_components_report
summary:
  name: read_missing_components_report
  description: >-
    Reads a missing-component audit JSON file (generated by 
    other tools) and returns a concise, 
    human-readable summary of the most problematic components.
  parameters:
    type: object
    properties:
      report_path:
        type: string
        description: "The exact path to the JSON report file to be read (e.g., 'run_123_audit_report.json')."
        required: true
      max_components:
        type: integer
        description: "Optional. Limit the summary to this many of the worst components."
        required: false
        default: 10
execution_details:
  type: python_function
  call:
    # Note the new module path
    module: "juno_tools.json_reading" 
    function: read_missing_components_report
usage_policy: 
  use_when:
    - You need to read json files
  do_not_use_when:
    - You do not need to read json files

output_schema:
  description: ""
  type: object
  properties: 
    file_type : json

